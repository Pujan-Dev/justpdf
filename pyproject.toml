[build-system]
requires = ["uv_build >= 0.9.26, <0.10.0"]
build-backend = "uv_build"

[project]
name = "justpdf"
version = "0.2.0"
authors = [
    { name = "Pujan Neupane", email = "pujanneupaneop0907@gmail.com" },
]
description = "A small, dependency-free library for extracting text from PDFs."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: Apache Software License",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pdf", "text-extraction", "document-processing"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Pujan-Dev/justpdf"
Repository = "https://github.com/Pujan-Dev/justpdf"
Issues = "https://github.com/Pujan-Dev/justpdf/issues"
